name: Deploy AWS with Terraform

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_TERRAFORM_DIR: infra/terraform/aws
  DOCKER_IMAGE_TAG: ${{ github.sha }}
  TF_IN_AUTOMATION: "true"
  TF_STATE_KEY: timelock-api/aws/terraform.tfstate

jobs:
  deploy:
    name: Deploy AWS infrastructure and app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository deployment settings
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          if [ -z "${{ vars.AWS_ROLE_ARN }}" ]; then
            echo "::error::Missing repository variable AWS_ROLE_ARN."
            missing=1
          fi

          if [ -z "${{ vars.AWS_REGION }}" ]; then
            echo "::error::Missing repository variable AWS_REGION."
            missing=1
          fi

          if [ -z "${{ vars.TF_STATE_BUCKET }}" ]; then
            echo "::error::Missing repository variable TF_STATE_BUCKET."
            missing=1
          fi

          if [ -z "${{ vars.TF_LOCK_TABLE }}" ]; then
            echo "::error::Missing repository variable TF_LOCK_TABLE."
            missing=1
          fi

          if [ -z "${{ secrets.TF_VAR_DB_PASSWORD }}" ]; then
            echo "::error::Missing repository secret TF_VAR_DB_PASSWORD."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Bootstrap Terraform remote state
        shell: bash
        run: |
          set -euo pipefail

          bucket="${{ vars.TF_STATE_BUCKET }}"
          table="${{ vars.TF_LOCK_TABLE }}"
          region="${{ vars.AWS_REGION }}"

          if ! aws s3api head-bucket --bucket "$bucket" >/dev/null 2>&1; then
            if [ "$region" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$bucket"
            else
              aws s3api create-bucket \
                --bucket "$bucket" \
                --create-bucket-configuration LocationConstraint="$region"
            fi
          fi

          aws s3api put-public-access-block \
            --bucket "$bucket" \
            --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

          aws s3api put-bucket-versioning \
            --bucket "$bucket" \
            --versioning-configuration Status=Enabled

          aws s3api put-bucket-encryption \
            --bucket "$bucket" \
            --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

          if ! aws dynamodb describe-table --table-name "$table" >/dev/null 2>&1; then
            aws dynamodb create-table \
              --table-name "$table" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST

            aws dynamodb wait table-exists --table-name "$table"
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Generate Terraform backend
        working-directory: ${{ env.AWS_TERRAFORM_DIR }}
        shell: bash
        run: |
          cat > backend.generated.tf <<EOF
          terraform {
            backend "s3" {
              bucket         = "${{ vars.TF_STATE_BUCKET }}"
              key            = "${{ env.TF_STATE_KEY }}"
              region         = "${{ vars.AWS_REGION }}"
              dynamodb_table = "${{ vars.TF_LOCK_TABLE }}"
              encrypt        = true
            }
          }
          EOF

      - name: Terraform init
        working-directory: ${{ env.AWS_TERRAFORM_DIR }}
        run: terraform init

      - name: Terraform validate
        working-directory: ${{ env.AWS_TERRAFORM_DIR }}
        run: terraform validate

      - name: Create ECR repository first
        working-directory: ${{ env.AWS_TERRAFORM_DIR }}
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_image_tag: ${{ env.DOCKER_IMAGE_TAG }}
        run: terraform apply -auto-approve -target=aws_ecr_repository.app

      - name: Build and push container image
        working-directory: ${{ env.AWS_TERRAFORM_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          repository_url=$(terraform output -raw ecr_repository_url)
          registry="${repository_url%/*}"

          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "$registry"

          docker build \
            -t "$repository_url:${{ env.DOCKER_IMAGE_TAG }}" \
            -t "$repository_url:latest" \
            ../../..

          docker push "$repository_url:${{ env.DOCKER_IMAGE_TAG }}"
          docker push "$repository_url:latest"

      - name: Deploy full AWS stack
        working-directory: ${{ env.AWS_TERRAFORM_DIR }}
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_image_tag: ${{ env.DOCKER_IMAGE_TAG }}
        run: terraform apply -auto-approve

      - name: Verify deployed health endpoint
        working-directory: ${{ env.AWS_TERRAFORM_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          app_url=$(terraform output -raw app_url)

          for attempt in {1..60}; do
            if curl --fail --silent --show-error "$app_url/health"; then
              echo
              echo "Health check succeeded."
              exit 0
            fi

            echo "Waiting for the app to become healthy... attempt $attempt/60"
            sleep 10
          done

          echo "The app did not become healthy in time."
          exit 1

      - name: Write deployment summary
        working-directory: ${{ env.AWS_TERRAFORM_DIR }}
        run: |
          app_url=$(terraform output -raw app_url)
          ecr_url=$(terraform output -raw ecr_repository_url)

          {
            echo "## TimeLock API AWS deployment"
            echo
            echo "- App URL: $app_url"
            echo "- Swagger: $app_url/docs"
            echo "- ECR repository: $ecr_url"
            echo "- Image tag: $DOCKER_IMAGE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"
