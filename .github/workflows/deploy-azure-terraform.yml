name: Deploy Azure with Terraform

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_TERRAFORM_DIR: infra/terraform/azure
  DOCKER_IMAGE_TAG: ${{ github.sha }}
  TF_IN_AUTOMATION: "true"

jobs:
  deploy:
    name: Deploy Azure infrastructure and app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository deployment settings
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          if [ -z "${{ vars.AZURE_CLIENT_ID }}" ]; then
            echo "::error::Missing repository variable AZURE_CLIENT_ID."
            missing=1
          fi

          if [ -z "${{ vars.AZURE_TENANT_ID }}" ]; then
            echo "::error::Missing repository variable AZURE_TENANT_ID."
            missing=1
          fi

          if [ -z "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "::error::Missing repository variable AZURE_SUBSCRIPTION_ID."
            missing=1
          fi

          if [ -z "${{ vars.AZURE_RESOURCE_GROUP }}" ]; then
            echo "::error::Missing repository variable AZURE_RESOURCE_GROUP."
            missing=1
          fi

          if [ -z "${{ vars.AZURE_LOCATION }}" ]; then
            echo "::error::Missing repository variable AZURE_LOCATION."
            missing=1
          fi

          if [ -z "${{ vars.AZURE_TF_STATE_RESOURCE_GROUP }}" ]; then
            echo "::error::Missing repository variable AZURE_TF_STATE_RESOURCE_GROUP."
            missing=1
          fi

          if [ -z "${{ vars.AZURE_TF_STATE_STORAGE_ACCOUNT }}" ]; then
            echo "::error::Missing repository variable AZURE_TF_STATE_STORAGE_ACCOUNT."
            missing=1
          fi

          if [ -z "${{ vars.AZURE_TF_STATE_CONTAINER }}" ]; then
            echo "::error::Missing repository variable AZURE_TF_STATE_CONTAINER."
            missing=1
          fi

          if [ -z "${{ secrets.TF_VAR_POSTGRES_ADMIN_PASSWORD }}" ]; then
            echo "::error::Missing repository secret TF_VAR_POSTGRES_ADMIN_PASSWORD."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Bootstrap Terraform remote state
        shell: bash
        run: |
          set -euo pipefail

          az group create \
            --name "${{ vars.AZURE_TF_STATE_RESOURCE_GROUP }}" \
            --location "${{ vars.AZURE_LOCATION }}"

          if ! az storage account show \
            --name "${{ vars.AZURE_TF_STATE_STORAGE_ACCOUNT }}" \
            --resource-group "${{ vars.AZURE_TF_STATE_RESOURCE_GROUP }}" >/dev/null 2>&1; then
            az storage account create \
              --name "${{ vars.AZURE_TF_STATE_STORAGE_ACCOUNT }}" \
              --resource-group "${{ vars.AZURE_TF_STATE_RESOURCE_GROUP }}" \
              --location "${{ vars.AZURE_LOCATION }}" \
              --sku Standard_LRS \
              --kind StorageV2 \
              --https-only true \
              --min-tls-version TLS1_2 \
              --allow-blob-public-access false
          fi

          storage_key=$(az storage account keys list \
            --account-name "${{ vars.AZURE_TF_STATE_STORAGE_ACCOUNT }}" \
            --resource-group "${{ vars.AZURE_TF_STATE_RESOURCE_GROUP }}" \
            --query '[0].value' \
            -o tsv)

          az storage container create \
            --name "${{ vars.AZURE_TF_STATE_CONTAINER }}" \
            --account-name "${{ vars.AZURE_TF_STATE_STORAGE_ACCOUNT }}" \
            --account-key "$storage_key" >/dev/null

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Register required Azure providers
        shell: bash
        run: |
          set -euo pipefail

          for namespace in \
            Microsoft.Authorization \
            Microsoft.ContainerRegistry \
            Microsoft.DBforPostgreSQL \
            Microsoft.ManagedIdentity \
            Microsoft.Storage \
            Microsoft.Web; do
            az provider register --namespace "$namespace" --wait
          done

      - name: Generate Terraform backend
        working-directory: ${{ env.AZURE_TERRAFORM_DIR }}
        shell: bash
        run: |
          storage_key=$(az storage account keys list \
            --account-name "${{ vars.AZURE_TF_STATE_STORAGE_ACCOUNT }}" \
            --resource-group "${{ vars.AZURE_TF_STATE_RESOURCE_GROUP }}" \
            --query '[0].value' \
            -o tsv)

          cat > backend.generated.tf <<EOF
          terraform {
            backend "azurerm" {
              resource_group_name  = "${{ vars.AZURE_TF_STATE_RESOURCE_GROUP }}"
              storage_account_name = "${{ vars.AZURE_TF_STATE_STORAGE_ACCOUNT }}"
              container_name       = "${{ vars.AZURE_TF_STATE_CONTAINER }}"
              key                  = "timelock-api/azure/terraform.tfstate"
              access_key           = "$storage_key"
            }
          }
          EOF

      - name: Terraform init
        working-directory: ${{ env.AZURE_TERRAFORM_DIR }}
        run: terraform init

      - name: Terraform validate
        working-directory: ${{ env.AZURE_TERRAFORM_DIR }}
        run: terraform validate

      - name: Create ACR first
        working-directory: ${{ env.AZURE_TERRAFORM_DIR }}
        env:
          TF_VAR_location: ${{ vars.AZURE_LOCATION }}
          TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
          TF_VAR_postgres_admin_password: ${{ secrets.TF_VAR_POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_image_tag: ${{ env.DOCKER_IMAGE_TAG }}
        run: terraform apply -auto-approve -target=azurerm_container_registry.acr

      - name: Build and push container image
        working-directory: ${{ env.AZURE_TERRAFORM_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          acr_name=$(terraform output -raw acr_name)
          acr_login_server=$(terraform output -raw acr_login_server)

          az acr login --name "$acr_name"

          docker build \
            -t "$acr_login_server/timelock-api:${{ env.DOCKER_IMAGE_TAG }}" \
            -t "$acr_login_server/timelock-api:latest" \
            ../../..

          docker push "$acr_login_server/timelock-api:${{ env.DOCKER_IMAGE_TAG }}"
          docker push "$acr_login_server/timelock-api:latest"

      - name: Deploy full Azure stack
        working-directory: ${{ env.AZURE_TERRAFORM_DIR }}
        env:
          TF_VAR_location: ${{ vars.AZURE_LOCATION }}
          TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
          TF_VAR_postgres_admin_password: ${{ secrets.TF_VAR_POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_image_tag: ${{ env.DOCKER_IMAGE_TAG }}
        run: terraform apply -auto-approve

      - name: Restart App Service
        working-directory: ${{ env.AZURE_TERRAFORM_DIR }}
        run: |
          az webapp restart \
            --name "$(terraform output -raw app_name)" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"

      - name: Verify deployed health endpoint
        working-directory: ${{ env.AZURE_TERRAFORM_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          app_url=$(terraform output -raw app_url)

          for attempt in {1..60}; do
            if curl --fail --silent --show-error "$app_url/health"; then
              echo
              echo "Health check succeeded."
              exit 0
            fi

            echo "Waiting for the app to become healthy... attempt $attempt/60"
            sleep 10
          done

          echo "The app did not become healthy in time."
          exit 1
